<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>둉굥이 공고레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--g:#173a33;--g2:#1f4d44;--lime:#d4f28c;--bg:#eef3f1;--card:#fff;--ink:#16241f;--sub:#5f6f69;--line:#dbe4e0;--red:#d6453d;--amber:#fff6dd;--amberline:#ecd28a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.hero{background:var(--g);color:#fff;padding:28px 18px 26px}
.wrap{max-width:820px;margin:0 auto}
.eyebrow{color:var(--lime);font-weight:800;font-size:15px;letter-spacing:.02em}
.hero h1{font-size:30px;margin:8px 0 10px;font-weight:900;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85;font-size:15px;line-height:1.6}
.made{margin-top:14px;font-size:13px;opacity:.7}
main{padding:16px 16px 60px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-size:30px;font-weight:900;letter-spacing:-.02em}
.stat span{color:var(--sub);font-size:14px}
.stat.hot b{color:var(--red)}
.note{background:var(--amber);border:1px solid var(--amberline);border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.6;margin-bottom:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
summary{font-weight:800;cursor:pointer}
details p{color:var(--sub);font-size:14px;line-height:1.65;margin:8px 0 0}
.tabs{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 16px;font:700 15px "Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);cursor:pointer}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.panel{display:none}.panel.on{display:block}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters input,.filters select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:15px "Noto Sans KR","Malgun Gothic",sans-serif;background:#fff;color:var(--ink)}
.filters input{grid-column:1/-1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px;color:var(--sub);font-size:14px}
.row label{display:flex;align-items:center;gap:6px;color:var(--ink)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font:700 14px "Noto Sans KR","Malgun Gothic",sans-serif;cursor:pointer;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:10px 0}
.card.hot{border-left:5px solid var(--red)}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.org{font-weight:800;font-size:16px;flex:1}
.star{background:none;border:0;font-size:24px;cursor:pointer;color:#9aa8a2;line-height:1}
.star.on{color:#f2b01e}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#e7f0ec;color:var(--g2);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700}
.chip.red{background:#fde8e6;color:var(--red)}.chip.dark{background:#eceff3;color:#43515b}.chip.amber{background:#fff1cf;color:#8a5a00}
.title{display:block;color:#1c6b57;font-size:18px;font-weight:800;line-height:1.45;text-decoration:none;margin:4px 0 8px}
.title mark{background:linear-gradient(transparent 55%,#ffe58a 55%);color:inherit}
.meta{color:var(--sub);font-size:13.5px;line-height:1.7}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ef;margin-top:12px;padding-top:10px;font-size:14px}
.foot a{color:#1c6b57;font-weight:700;text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:30px;background:#fff;border-radius:16px;border:1px dashed var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
th,td{padding:12px 12px;text-align:left;border-bottom:1px solid #edf1ef;vertical-align:top}
th{background:#f3f7f5;color:var(--sub)}
tr:last-child td{border-bottom:0}
.ok{color:#1d8a5a;font-weight:800}.bad{color:var(--red);font-weight:800}
td a{color:#1c6b57;text-decoration:none;word-break:break-all;font-size:12.5px}
h2{font-size:22px;margin:6px 0 8px}
.small{color:var(--sub);font-size:14px;line-height:1.6;margin:0 0 12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231e;--ink:#e6efe9;--sub:#9fb0a8;--line:#2a3a33;--amber:#2e2816;--amberline:#5a4a1c}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231e;--ink:#e6efe9;--sub:#9fb0a8;--line:#2a3a33;--amber:#2e2816;--amberline:#5a4a1c}
.filters input,.filters select,.tab,.btn{background:var(--card);color:var(--ink)}
.title{color:#2f8f74}
th{background:var(--card)}
table{background:var(--card)}
.chip{background:rgba(47,143,116,.14)}
.chip.gray{background:rgba(120,120,120,.18);color:var(--sub)}
.card.done{opacity:.62}
.row label{margin-right:10px}
#sitetab td:nth-child(-n+4),#sitetab th:nth-child(-n+4){white-space:nowrap}
#sitetab{display:block;overflow-x:auto}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="eyebrow" id="eyebrow">충북 · 경기 · 서울 지자체 + 나라장터</div>
  <h1>둉굥이 공고레이더</h1>
  <p>교량 · 보수보강 · 내진 · 공법 제안 공고를 모아 확인하세요.<br>찾은 공고와 확인하지 못한 기관을 함께 보여줍니다.</p>
  <div class="made" id="made"></div>
</div></header>
<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="note" id="note"></div>
  <details><summary>수집 범위와 조건</summary><div id="cond"></div></details>
  <div class="tabs">
    <button class="tab on" data-p="p1">관련 공고</button>
    <button class="tab" data-p="p2">수집 현황</button>
  </div>
  <section class="panel on" id="p1">
    <div class="filters">
      <input id="q" placeholder="공고명 · 기관 검색">
      <select id="fr"><option value="">전체 지역</option><option>충북</option><option>경기</option><option>서울</option><option>기타</option></select>
      <select id="ff"><option value="">전체 분야</option><option>공법·기술제안</option><option>교량·구조물</option><option>내진·보강</option><option>하천·수리시설</option><option>점검·진단</option><option>검토할 공고</option></select>
      <select id="fg"><option value="">참여·참고·결과 모두</option><option>참여할 공고</option><option>참고자료</option><option>결과·영업정보</option></select>
      <select id="fk"><option value="">입찰·낙찰·고시 모두</option><option value="입찰">나라장터 입찰공고</option><option value="낙찰">나라장터 낙찰 결과</option><option value="고시공고">시·군·구청 고시공고</option></select>
    </div>
    <div class="row"><label><input type="checkbox" id="fn"> 새 공고만(어제·오늘)</label><label><input type="checkbox" id="fo"> 진행 중만(마감·취소 빼기)</label><label><input type="checkbox" id="fs"> 저장한 공고만</label><button class="btn" id="csv">엑셀용 CSV 받기</button><span id="cnt"></span></div>
    <div id="list"></div>
  </section>
  <section class="panel" id="p2">
    <h2>빠진 곳까지 확인하기</h2>
    <p class="small">‘수집완료’는 그 기관 게시판 목록을 넘겨 가며 맨 끝 글이 7일보다 옛날이 될 때까지 읽은 경우(맨 위 고정 공지의 옛 날짜는 따지지 않음), ‘일부’는 읽긴 했지만 7일 치 끝까지 못 닿은 경우, ‘연결실패’는 그날 기관 서버가 응답하지 않은 경우입니다. 다음 날 다시 시도합니다.</p>
    <div id="auto" class="small"></div>
    <div class="row"><button class="btn" id="csv2">기관 현황 CSV</button></div>
    <table id="apitab"></table><div style="height:12px"></div>
    <table id="sitetab"></table>
  </section>
</main>

$('#csv2').onclick = () => dl('기관현황.csv', ['기관','지역','상태','읽은 글','주소','7일 넘어 처음 읽은 글','7일 안 글'], D.기관);
$('#apitab').innerHTML = '<tr><th>나라장터(조달청 데이터)</th><th>상태</th><th>확인 내용</th></tr>' + D.나라장터.map(x=>`<tr><td><b>${esc(x[0])}</b></td><td class="${x[1]==='수집완료'?'ok':'bad'}">${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('');
$('#sitetab').innerHTML = '<tr><th>기관</th><th>지역</th><th>상태</th><th>7일 안 글 / 읽은 글</th><th>7일 넘어 처음 읽은 글</th><th>게시판 주소</th></tr>' + D.기관.map(x=>`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td class="${x[2]==='수집완료'?'ok':'bad'}">${esc(x[2])}</td><td>${esc(x[6]??'')} / ${esc(x[3])}건</td><td>${esc(x[5]||'')}</td><td><a href="${esc(x[4])}" target="_blank">${esc(x[4].slice(0,60))}${x[4].length>60?'…':''}</a></td></tr>`).join('');
render();
setInterval(() => { recheck(); render(); }, 5*60e3);   // 켜 둔 채로 있어도 5분마다 마감 다시 판정
const A = D.자동 || {};
$('#auto').innerHTML = `<p><b>자동 갱신</b> · ${esc(A.방식||'')}</p><p>다음 자동 수집 <b>${esc(A.다음||'?')}</b> · 지난 스케줄러 실행 ${esc(A.지난||'?')}</p>`
  + ((A.기록||[]).length ? '<table><tr><th>수집 시각</th><th>결과</th></tr>' + A.기록.map(x=>`<tr><td>${esc(x.시각)}</td><td>${esc(x.결과)}</td></tr>`).join('') + '</table>' : '');
</script>
</body>
</html>
